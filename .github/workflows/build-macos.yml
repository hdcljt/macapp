name: Build Desktop Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 用于创建 Release

jobs:
  # ============================================================
  # macOS 分架构构建 (Intel + Apple Silicon)
  # ============================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 npm 镜像（中国大陆加速）
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV

      - name: 安装依赖
        run: npm ci

      - name: 生成图标（含 .icns）
        run: npm run icon:generate

      - name: 打包 macOS (${{ matrix.arch }})
        run: npm run build:mac -- --${{ matrix.arch }} --publish never
        env:
          # 内部分发，禁用签名与公证
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""

      - name: 检查产物
        run: |
          echo "===== 产物列表 ====="
          ls -lh release/*/
          echo ""
          echo "===== DMG / ZIP ====="
          find release -type f \( -name "*.dmg" -o -name "*.zip" \)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macapp-macos-${{ matrix.arch }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # macOS Universal（双架构合并包）
  # ============================================================
  build-macos-universal:
    name: macOS Universal
    runs-on: macos-14
    needs: build-macos

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 npm 镜像
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV

      - run: npm ci
      - run: npm run icon:generate

      - name: 打包 Universal
        run: npm run build:mac:universal -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""

      - uses: actions/upload-artifact@v4
        with:
          name: macapp-macos-universal
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
          retention-days: 30

  # ============================================================
  # Windows NSIS 安装程序 + 便携 ZIP
  # ============================================================
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 npm 镜像
        shell: pwsh
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $env:GITHUB_ENV

      - name: 安装依赖
        run: npm ci

      - name: 生成图标（含 .ico）
        run: npm run icon:generate

      # CI 是干净环境，直接走默认 builder（自动下载 + 解压 Electron，无 EPERM 问题）
      # 本地 Windows 打包请用 npm run build:win:nsis（已处理 Defender EPERM 锁）
      - name: 打包 NSIS installer + 便携 ZIP
        run: npm run build:win -- --publish never
        env:
          ELECTRON_RUN_AS_NODE: '0'

      - name: 检查产物
        shell: pwsh
        run: |
          echo "===== 产物列表 ====="
          Get-ChildItem -Recurse release/ | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length/1MB, 2)}} | Format-Table -AutoSize

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macapp-windows
          path: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 创建 GitHub Release（tag 触发）
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-macos-universal, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | sort

      # 用 gh CLI 替换 softprops/action-gh-release@v2。
      # 原 softprops 走"先 upload 再 PATCH label"的两段式，在并发文件下
      # 会撞 GitHub release asset 的写后读延迟窗口（PATCH 时 asset_id 404）。
      # gh release create + gh release upload --clobber 走单步原子 API，
      # 不再有后续 PATCH，从根上避开这个竞态。
      - name: 创建 Release（不带任何 asset）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARGS=("$TAG_NAME" --title "$TAG_NAME" --generate-notes)
          if [[ "$TAG_NAME" == *rc* || "$TAG_NAME" == *beta* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

      - name: 上传所有产物（--clobber 允许重跑场景）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f | sort)
          echo "待上传文件 ($(printf '%s\n' "${FILES[@]}" | wc -l) 个)："
          printf '  %s\n' "${FILES[@]}"
          gh release upload "${{ github.ref_name }}" --clobber "${FILES[@]}"