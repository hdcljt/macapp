name: Build Desktop Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 用于创建 Release

jobs:
  # ============================================================
  # macOS Universal（同时产出 arm64 + x64 + universal 三套 dmg/zip）
  # universal job 在 Apple Silicon runner 上一次跑完所有架构，
  # 省去分架构 job 的 latest-mac.yml 冲突和冗余 cleanup 步骤。
  # ============================================================
  build-macos:
    name: macOS Universal
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 npm 镜像（中国大陆加速）
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV

      - name: 安装依赖
        run: npm ci

      - name: 生成图标（含 .icns）
        run: npm run icon:generate

      - name: 打包 macOS Universal
        run: npm run build:mac:universal -- --publish never
        env:
          # 内部分发，禁用签名与公证
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""

      - name: 检查产物
        run: |
          echo "===== 产物列表 ====="
          ls -lh release/*/
          echo ""
          echo "===== DMG / ZIP ====="
          find release -type f \( -name "*.dmg" -o -name "*.zip" \)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macapp-macos-universal
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/**/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Windows NSIS 安装程序 + 便携 ZIP
  # ============================================================
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 npm 镜像
        shell: pwsh
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $env:GITHUB_ENV

      - name: 安装依赖
        run: npm ci

      - name: 生成图标（含 .ico）
        run: npm run icon:generate

      # CI 是干净环境，直接走默认 builder（自动下载 + 解压 Electron，无 EPERM 问题）
      # 本地 Windows 打包请用 npm run build:win:nsis（已处理 Defender EPERM 锁）
      - name: 打包 NSIS installer + 便携 ZIP
        run: npm run build:win -- --publish never
        env:
          ELECTRON_RUN_AS_NODE: '0'

      - name: 检查产物
        shell: pwsh
        run: |
          echo "===== 产物列表 ====="
          Get-ChildItem -Recurse release/ | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length/1MB, 2)}} | Format-Table -AutoSize

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macapp-windows
          path: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.blockmap
            release/**/latest.yml
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 创建 GitHub Release（tag 触发）
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | sort

      # 用 gh CLI 替换 softprops/action-gh-release@v2。
      # 简化到 universal-only 后无跨 job 并发上传，避免 softprops 两段式
      # upload + PATCH label 在并发下的 asset_id 404 竞态。
      - name: 创建 Release（不带任何 asset；已存在则跳过，覆盖走 --clobber）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 重跑场景：tag 再次触发 workflow 时 release 可能已经存在，
          # gh release create 同名会失败；这时让 upload 走 --clobber 补齐即可。
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，跳过创建"
            exit 0
          fi
          ARGS=("$TAG_NAME" --title "$TAG_NAME" --generate-notes)
          if [[ "$TAG_NAME" == *rc* || "$TAG_NAME" == *beta* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

      - name: 上传所有产物（--clobber 允许重跑场景）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f | sort)
          echo "待上传文件 ($(printf '%s\n' "${FILES[@]}" | wc -l) 个)："
          printf '  %s\n' "${FILES[@]}"
          gh release upload "${{ github.ref_name }}" --clobber "${FILES[@]}"
