<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';" />
  <title>发现新版本</title>
  <style>
    :root {
      --primary: #0071e3;
      --primary-hover: #0077ed;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --bg: #ffffff;
      --bg-soft: #f5f5f7;
      --border: #d2d2d7;
      --error-bg: #fff2f2;
      --error-text: #d70015;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 顶部：图标 + 版本号 */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0071e3, #5e5ce6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 113, 227, 0.18);
    }
    .icon::after {
      content: "↑";
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    .version {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.3;
    }
    .version .current {
      font-variant-numeric: tabular-nums;
    }
    .version .arrow {
      margin: 0 8px;
      color: #c7c7cc;
    }
    .version .latest {
      color: var(--primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Release notes：填满剩余空间 */
    .notes {
      flex: 1;
      min-height: 60px;
      overflow-y: auto;
      padding: 12px 14px;
      background: var(--bg-soft);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.65;
      color: #424245;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 进度条 */
    .progress-wrap { flex-shrink: 0; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .progress-label-pct {
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-weight: 500;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #e5e5ea;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s ease;
    }

    /* 错误 */
    .error-msg {
      flex-shrink: 0;
      padding: 10px 14px;
      background: var(--error-bg);
      border-radius: 8px;
      color: var(--error-text);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 按钮 */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    button {
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      transition: background 0.12s, opacity 0.12s;
    }
    button:hover:not(:disabled) { background: #f5f5f7; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    button[hidden] { display: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon" aria-hidden="true"></div>
    <div class="version">
      <span class="current" id="current">…</span>
      <span class="arrow">→</span>
      <span class="latest" id="latest">…</span>
    </div>
  </div>

  <div class="notes" id="notes"></div>

  <div class="progress-wrap" id="progress-wrap" hidden>
    <div class="progress-header">
      <span>下载中</span>
      <span class="progress-label-pct" id="progress-label">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  </div>

  <div class="error-msg" id="error-msg" hidden></div>

  <div class="actions">
    <button id="btn-later">以后再说</button>
    <button id="btn-install" class="primary" hidden>立即安装</button>
    <button id="btn-update" class="primary">立即更新</button>
  </div>

  <script src="updater.js"></script>
</body>
</html>
