<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';" />
  <title>发现新版本</title>
  <link rel="stylesheet" href="updater.css" />
</head>
<body>
  <header class="header">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </div>
    <div class="header-text">
      <h1 class="title">发现新版本</h1>
      <p class="version">
        <span class="current">v<span id="current">…</span></span>
        <span class="arrow">→</span>
        <span class="latest">v<span id="latest">…</span></span>
      </p>
    </div>
  </header>

  <section class="notes-section">
    <p class="section-label">更新内容</p>
    <div class="notes" id="notes"></div>
  </section>

  <section class="progress-section" id="progress-wrap" hidden>
    <div class="progress-info">
      <span class="progress-status"><span class="dot"></span>下载中</span>
      <span class="progress-pct" id="progress-label">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  </section>

  <section class="error-section" id="error-msg" hidden></section>

  <footer class="actions">
    <button id="btn-later" class="secondary">以后再说</button>
    <button id="btn-install" class="primary" hidden>立即安装</button>
    <button id="btn-update" class="primary">立即更新</button>
  </footer>

  <script src="updater.js"></script>
</body>
</html>
